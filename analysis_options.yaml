include: package:dart_flutter_team_lints/analysis_options.yaml

linter:
  rules:
    - avoid_print
    - public_member_api_docs

analyzer:
  exclude:
    - "**/*.g.dart"
    - "clients/**"
    - "!clients/didcomm/**"

  cannot-ignore:
    - implementation_imports
  errors:
    lines_longer_than_80_chars: ignore
    avoid_print: ignore
    implementation_imports: error
